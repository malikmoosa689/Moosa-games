async function boot(){
 try{
  if(!window.firebase||FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0){app.innerHTML='<div class="msg">Setup needed: paste your Firebase settings at the top of this file (see the steps).</div>';return}
  firebase.initializeApp(FIREBASE_CONFIG);
  var cred=await firebase.auth().signInAnonymously();uid=cred.user.uid;
  var fs=firebase.firestore();
  db={doc:function(p){var r=fs.doc(p);return{set:function(d){return r.set(d)},update:function(d){return r.update(d)}}},
   collection:function(n){var c=fs.collection(n);return{add:function(d){return c.add(d)},onSnapshot:function(cb){return c.onSnapshot(function(sn){cb({docs:sn.docs.map(function(d){return{id:d.id,data:function(){return d.data()}}})})})}}}};
  isOwner=location.hash==="#"+OWNER_CODE;
  var timer=setTimeout(function(){if(!ready)app.innerHTML='<div class="msg">Could not load. Check your connection and reopen.</div>'},10000),seen={};
  function chk(k){seen[k]=1;if(seen.p&&seen.q&&seen.a){clearTimeout(timer);ready=true}if(!pl&&!mk||ready)render()}
  db.collection("players").onSnapshot(function(s){players={};s.docs.forEach(function(x){players[x.id]=x.data()});chk("p")});
  db.collection("quizzes").onSnapshot(function(s){quizzes={};s.docs.forEach(function(x){quizzes[x.id]=x.data()});chk("q")});
  db.collection("attempts").onSnapshot(function(s){attempts=s.docs.map(function(x){return x.data()});chk("a")});
  db.collection("testphotos").onSnapshot(function(s){tphotos={};s.docs.forEach(function(x){tphotos[x.id]=x.data().img});if(ready)render()});
  db.collection("testqs").onSnapshot(function(sn){tqs=sn.docs.map(function(x){var o=x.data();return{id:"c"+x.id,text:o.text,ts:o.ts}}).sort(function(a,b){return a.ts-b.ts});if(ready)render()});
  db.collection("testvotes").onSnapshot(function(s){tvotes=s.docs.map(function(x){return x.data()});if(ready)render()});
 }catch(e){app.innerHTML='<div class="msg">Could not start the game. Reload to try again.</div>'}
}
boot();
